<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoHub - Knowledge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-600">InfoHub 🚀</h1>
            <button onclick="accessAdmin()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Author Panel 🔒</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">

        <!-- Search Box -->
        <div class="mb-8">
            <input type="text" id="search-input" onkeyup="filterArticles()" placeholder="🔍 Search articles by title, category or content..." class="w-full p-4 border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-700">
        </div>

        <!-- Author Panel Form (Hidden by default) -->
        <div id="admin-panel" class="hidden bg-white p-6 rounded-xl shadow-lg border border-indigo-100 mb-10">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-indigo-600">Publish New Article 📝</h3>
                <button onclick="toggleAdmin()" class="text-slate-400 hover:text-slate-600 font-bold">✕ Close</button>
            </div>
            
            <input type="text" id="art-title" placeholder="Article Title *" class="w-full p-3 border border-slate-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="text" id="art-cat" placeholder="Category (e.g., Tamil, Tech, General)" class="w-full p-3 border border-slate-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            
            <!-- Shortcode Helper Guide -->
            <div class="bg-indigo-50 p-3.5 rounded-xl text-xs text-indigo-900 mb-3 space-y-1 border border-indigo-100">
                <p class="font-bold">💡 Content-la enge venum-naalum media insert pannalaam:</p>
                <p>• Image: <code class="bg-white px-1.5 py-0.5 rounded text-indigo-600 font-semibold">[img: https://url.com/image.jpg]</code></p>
                <p>• Video / YouTube: <code class="bg-white px-1.5 py-0.5 rounded text-indigo-600 font-semibold">[video: https://youtube.com/watch?v=xxx]</code></p>
                <p>• Audio: <code class="bg-white px-1.5 py-0.5 rounded text-indigo-600 font-semibold">[audio: https://url.com/audio.mp3]</code></p>
                <p>• Carousel Slider: <code class="bg-white px-1.5 py-0.5 rounded text-indigo-600 font-semibold">[carousel: url1, url2, url3]</code></p>
            </div>

            <textarea id="art-body" rows="8" placeholder="Write your content here... Use shortcodes anywhere inside text!" class="w-full p-3 border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>

            <button onclick="publishArticle()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Publish Article 🚀</button>
        </div>

        <!-- Articles Grid Container -->
        <div id="articles-list" class="grid gap-6 md:grid-cols-2">
            <!-- Articles load dynamically -->
        </div>

    </main>

    <script>
        const ADMIN_PASSWORD = "1234";

        let articles = JSON.parse(localStorage.getItem('my_info_articles')) || [
            {
                id: 1,
                title: "முல்லைப்பாட்டு",
                category: "தமிழ்",
                body: "முல்லைப்பாட்டு என்பது பத்துப்பாட்டு நூல்களில் மிகச் சிறிய நூல் ஆகும். இது 103 அடிகளைக் கொண்டது.\n\n[carousel: https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800, https://images.unsplash.com/photo-1519046904884-53103b34b206?w=800]\n\nஇதன் ஆசிரியர் காவிரிப் பூம்பட்டினத்து பொன்வணிகனார் மகன் நப்பூதனார் ஆவார்."
            }
        ];

        function saveAndRender() {
            localStorage.setItem('my_info_articles', JSON.stringify(articles));
            renderArticles(articles);
        }

        function parseContent(text) {
            if (!text) return '';

            // 1. Process Carousels [carousel: url1, url2, url3]
            text = text.replace(/\[carousel:\s*([^\]]+)\]/gi, function(match, urlsStr) {
                const urls = urlsStr.split(',').map(u => u.trim());
                let slidesHTML = urls.map(url => `
                    <div class="flex-none w-full snap-center">
                        <img src="${url}" class="w-full h-52 object-cover rounded-xl shadow-sm" onerror="this.style.display='none'">
                    </div>
                `).join('');
                
                return `
                    <div class="relative my-4">
                        <div class="carousel-container flex overflow-x-auto snap-x snap-mandatory gap-3 rounded-xl scroll-smooth">
                            ${slidesHTML}
                        </div>
                        <p class="text-center text-xs text-slate-400 mt-1">Swipe horizontal for more ➔</p>
                    </div>
                `;
            });

            // 2. Process Single Images [img: url]
            text = text.replace(/\[img:\s*([^\]]+)\]/gi, function(match, url) {
                return `<img src="${url.trim()}" class="w-full max-h-80 object-cover rounded-xl my-4 shadow-sm" onerror="this.style.display='none'">`;
            });

            // 3. Process Videos / YouTube [video: url]
            text = text.replace(/\[video:\s*([^\]]+)\]/gi, function(match, url) {
                url = url.trim();
                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    let embedUrl = url.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
                    return `<div class="my-4 aspect-video"><iframe class="w-full h-full rounded-xl shadow-sm" src="${embedUrl}" frameborder="0" allowfullscreen></iframe></div>`;
                }
                return `<video controls class="w-full rounded-xl my-4 shadow-sm"><source src="${url}"></video>`;
            });

            // 4. Process Audio [audio: url]
            text = text.replace(/\[audio:\s*([^\]]+)\]/gi, function(match, url) {
                return `<audio controls class="w-full my-4"><source src="${url.trim()}"></audio>`;
            });

            return text;
        }

        function renderArticles(dataToRender) {
            const list = document.getElementById('articles-list');
            list.innerHTML = '';

            if (dataToRender.length === 0) {
                list.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-10">No articles found!</div>';
                return;
            }

            dataToRender.forEach(art => {
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between relative';
                
                const parsedBody = parseContent(art.body);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded">${art.category || 'General'}</span>
                            <button onclick="deleteArticle(${art.id})" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-lg text-xs font-bold transition">🗑 Delete</button>
                        </div>
                        <h3 class="text-xl font-bold mb-2 text-slate-800">${art.title}</h3>
                        <div class="text-slate-600 text-sm whitespace-pre-line leading-relaxed">${parsedBody}</div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function accessAdmin() {
            const pass = prompt("Enter Author Password:");
            if (pass === ADMIN_PASSWORD) {
                toggleAdmin();
            } else if (pass !== null) {
                alert("Incorrect Password! Access Denied.");
            }
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        function publishArticle() {
            const title = document.getElementById('art-title').value.trim();
            const category = document.getElementById('art-cat').value.trim();
            const body = document.getElementById('art-body').value.trim();

            if (!title || !body) {
                alert('Please fill in Title and Content!');
                return;
            }

            const newArt = {
                id: Date.now(),
                title,
                category,
                body
            };

            articles.unshift(newArt);
            saveAndRender();

            document.getElementById('art-title').value = '';
            document.getElementById('art-cat').value = '';
            document.getElementById('art-body').value = '';

            toggleAdmin();
            alert('Article Published Successfully! 🎉');
        }

        function deleteArticle(id) {
            const pass = prompt("Enter Author Password to Delete:");
            if (pass === ADMIN_PASSWORD) {
                if (confirm("Are you sure you want to delete this article?")) {
                    articles = articles.filter(art => art.id !== id);
                    saveAndRender();
                    alert("Article deleted successfully!");
                }
            } else if (pass !== null) {
                alert("Incorrect Password! Delete cancelled.");
            }
        }

        function filterArticles() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = articles.filter(art => 
                art.title.toLowerCase().includes(query) || 
                art.category.toLowerCase().includes(query) || 
                art.body.toLowerCase().includes(query)
            );
            renderArticles(filtered);
        }

        // Initial Load
        renderArticles(articles);
    </script>
</body>
</html>
