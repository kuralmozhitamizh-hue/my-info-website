<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoHub - Knowledge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-600">InfoHub 🚀</h1>
            <button onclick="toggleAdmin()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Author Panel</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <!-- Admin Panel Form (Hidden by default) -->
        <div id="admin-panel" class="hidden bg-white p-6 rounded-xl shadow-md border border-slate-200 mb-10">
            <h3 class="text-xl font-bold mb-4 text-indigo-600">Publish New Article</h3>
            <input type="text" id="art-title" placeholder="Article Title" class="w-full p-3 border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="text" id="art-cat" placeholder="Category (e.g., Technology)" class="w-full p-3 border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <textarea id="art-body" rows="4" placeholder="Write your content here..." class="w-full p-3 border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <button onclick="publishArticle()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 transition">Publish Live</button>
        </div>

        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold tracking-tight mb-4">Welcome to Knowledge Hub</h2>
            <p class="text-lg text-slate-600">Clean, fast, and modern articles published by creators worldwide.</p>
        </div>

        <!-- Articles Container -->
        <div id="articles-list" class="grid gap-6 md:grid-cols-2">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded">Technology</span>
                <h3 class="text-xl font-bold mt-3 mb-2">Getting Started with Modern Web Dev</h3>
                <p class="text-slate-600 text-sm">Learn how to build fast, beautiful, and secure information websites easily.</p>
            </div>
        </div>
    </main>

    <script>
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        function publishArticle() {
            const title = document.getElementById('art-title').value;
            const category = document.getElementById('art-cat').value;
            const body = document.getElementById('art-body').value;

            if(!title || !body) {
                alert('Please fill in title and body!');
                return;
            }

            const list = document.getElementById('articles-list');
            const newCard = document.createElement('div');
            newCard.className = 'bg-white p-6 rounded-xl shadow-sm border border-slate-200';
            newCard.innerHTML = `
                <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded">${category || 'General'}</span>
                <h3 class="text-xl font-bold mt-3 mb-2">${title}</h3>
                <p class="text-slate-600 text-sm">${body}</p>
            `;
            
            list.prepend(newCard);
            
            // Clear inputs & hide
            document.getElementById('art-title').value = '';
            document.getElementById('art-cat').value = '';
            document.getElementById('art-body').value = '';
            toggleAdmin();
            alert('Article Published Successfully!');
        }
    </script>
</body>
</html>
