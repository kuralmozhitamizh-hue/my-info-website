<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoHub - Knowledge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- YouTube Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
            margin: 0;
            padding: 0;
        }
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-container { -ms-overflow-style: none; scrollbar-width: none; }
        .strict-break {
            word-break: break-all;
            overflow-wrap: break-word;
            max-width: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans w-full max-w-full overflow-x-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50 w-full max-w-full">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center w-full">
            <h1 class="text-xl sm:text-2xl font-black text-indigo-600 truncate">InfoHub 🚀</h1>
            <button id="author-btn" onclick="handleAuthorAccess()" class="bg-indigo-600 text-white px-3 py-2 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-semibold hover:bg-indigo-700 transition whitespace-nowrap">Author Panel 🔒</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 w-full max-w-full overflow-x-hidden">

        <!-- Search Box -->
        <div class="mb-6 w-full max-w-full">
            <input type="text" id="search-input" onkeyup="filterArticles()" placeholder="🔍 Search articles..." class="w-full p-3.5 border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-700 text-sm">
        </div>

        <!-- Author Panel Form (Hidden by default) -->
        <div id="admin-panel" class="hidden bg-white p-4 sm:p-6 rounded-xl shadow-lg border border-indigo-100 mb-8 w-full max-w-full overflow-hidden">
            <div class="flex justify-between items-center mb-4">
                <h3 id="form-title" class="text-lg font-bold text-indigo-600">Publish New Article 📝</h3>
                <button onclick="toggleAdmin()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕ Close</button>
            </div>
            
            <input type="hidden" id="editing-id" value="">

            <input type="text" id="art-title" placeholder="Article Title *" class="w-full p-3 border border-slate-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            <input type="text" id="art-cat" placeholder="Category (e.g., Tamil, Tech)" class="w-full p-3 border border-slate-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            
            <!-- Shortcode Helper Guide -->
            <div class="bg-indigo-50 p-3 rounded-xl text-xs text-indigo-900 mb-3 space-y-1 border border-indigo-100 strict-break">
                <p class="font-bold text-xs">💡 Media Shortcodes:</p>
                <p>• Image: <code class="bg-white px-1 py-0.5 rounded text-indigo-600">[img: url]</code></p>
                <p>• Video: <code class="bg-white px-1 py-0.5 rounded text-indigo-600 font-semibold">[video: url]</code></p>
                <p>• Audio: <code class="bg-white px-1 py-0.5 rounded text-indigo-600 font-semibold">[audio: url]</code></p>
                <p>• Carousel: <code class="bg-white px-1 py-0.5 rounded text-indigo-600 font-semibold">[carousel: url1, url2]</code></p>
            </div>

            <textarea id="art-body" rows="6" placeholder="Write content here..." class="w-full p-3 border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm strict-break"></textarea>

            <div class="flex gap-2 w-full">
                <button onclick="saveArticle(true)" class="w-1/2 bg-amber-500 text-white py-2.5 rounded-lg font-bold hover:bg-amber-600 transition text-xs sm:text-sm">Save Draft 💾</button>
                <button onclick="saveArticle(false)" class="w-1/2 bg-green-600 text-white py-2.5 rounded-lg font-bold hover:bg-green-700 transition text-xs sm:text-sm">Publish 🚀</button>
            </div>
        </div>

        <!-- Drafts Section for Author -->
        <div id="drafts-container" class="hidden mb-8 w-full max-w-full">
            <h2 class="text-lg font-bold mb-3 text-amber-600">📂 Unpublished Drafts</h2>
            <div id="drafts-list" class="grid gap-6 md:grid-cols-2 w-full"></div>
            <hr class="my-6 border-slate-200">
        </div>

        <!-- Articles Grid Container -->
        <div id="articles-list" class="grid gap-6 md:grid-cols-2 w-full max-w-full">
            <!-- Articles load dynamically -->
        </div>

    </main>

    <script>
        const ADMIN_PASSWORD = "1234";
        let isLoggedIn = false;
        let ytPlayers = [];

        let articles = JSON.parse(localStorage.getItem('my_info_articles')) || [
            {
                id: 1,
                title: "முல்லைப்பாட்டு Demo",
                category: "தமிழ்",
                isDraft: false,
                body: "முல்லைப்பாட்டு என்பது பத்துப்பாட்டு நூல்களில் மிகச் சிறிய நூல் ஆகும்.\n\n[carousel: https://picsum.photos/id/1018/800/400, https://picsum.photos/id/1015/800/400]\n\nஇது 103 அடிகளைக் கொண்டது."
            }
        ];

        // Global single media playback enforcement for HTML video/audio
        document.addEventListener('play', function(e) {
            const target = e.target;
            if (target && (target.tagName === 'VIDEO' || target.tagName === 'AUDIO')) {
                pauseAllMedia(target);
            }
        }, true);

        function pauseAllMedia(currentElement = null) {
            // Pause HTML video and audio elements
            const allMedia = document.querySelectorAll('video, audio');
            allMedia.forEach(media => {
                if (media !== currentElement) {
                    media.pause();
                }
            });

            // Pause all YouTube iframe players
            ytPlayers.forEach(player => {
                if (player && player.pauseVideo && player.getIframe() !== currentElement) {
                    try {
                        player.pauseVideo();
                    } catch(err) {}
                }
            });
        }

        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function initYouTubePlayers() {
            ytPlayers = [];
            const iframes = document.querySelectorAll('iframe.yt-embed-player');
            iframes.forEach(iframe => {
                let player = new YT.Player(iframe, {
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
                ytPlayers.push(player);
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                pauseAllMedia(event.target.getIframe());
            }
        }

        function saveAndRender() {
            localStorage.setItem('my_info_articles', JSON.stringify(articles));
            renderArticles(articles);
        }

        function isMediaUrl(url, type) {
            url = url.trim();
            if (type === 'image') return url.match(/\.(jpeg|jpg|gif|png|webp|svg)/i) || url.includes('picsum.photos') || url.includes('unsplash.com');
            if (type === 'video') return url.match(/\.(mp4|webm|ogg)/i) || url.includes('youtube.com') || url.includes('youtu.be');
            if (type === 'audio') return url.match(/\.(mp3|wav|ogg|aac)/i);
            return false;
        }

        function parseContent(text) {
            if (!text) return '';

            // 1. Process Carousels
            text = text.replace(/\[carousel:\s*([^\]]+)\]/gi, function(match, urlsStr) {
                const urls = urlsStr.split(',').map(u => u.trim());
                const carouselId = 'carousel_' + Math.random().toString(36).substring(2, 9);
                
                let slidesHTML = urls.map(url => {
                    let ytId = extractYouTubeId(url);
                    if (ytId || isMediaUrl(url, 'video')) {
                        if (ytId) {
                            return `<div class="flex-none w-full snap-center aspect-video max-w-full"><iframe id="yt_${Math.random().toString(36).substring(2, 9)}" class="yt-embed-player w-full h-full rounded-xl" src="https://www.youtube.com/embed/${ytId}?enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
                        } else {
                            return `<div class="flex-none w-full snap-center aspect-video max-w-full"><video controls class="w-full rounded-xl shadow-sm"><source src="${url}"></video></div>`;
                        }
                    } else if (isMediaUrl(url, 'audio')) {
                        return `<div class="flex-none w-full snap-center bg-slate-100 p-3 rounded-xl flex items-center max-w-full"><audio controls class="w-full"><source src="${url}"></audio></div>`;
                    } else {
                        return `<div class="flex-none w-full snap-center max-w-full"><img src="${url}" class="w-full h-48 object-cover rounded-xl shadow-sm" onerror="this.src='https://via.placeholder.com/600x300?text=Image'"></div>`;
                    }
                }).join('');

                let dotsHTML = urls.map((_, idx) => `
                    <button onclick="scrollToSlide('${carouselId}', ${idx})" class="w-2 h-2 rounded-full transition-all duration-300 ${idx === 0 ? 'bg-indigo-600 w-4' : 'bg-slate-300'}"></button>
                `).join('');
                
                return `
                    <div class="relative my-4 w-full max-w-full overflow-hidden">
                        <div id="${carouselId}" onscroll="updateDots('${carouselId}', ${urls.length})" class="carousel-container flex overflow-x-auto snap-x snap-mandatory gap-3 rounded-xl scroll-smooth w-full">
                            ${slidesHTML}
                        </div>
                        <div id="${carouselId}_dots" class="flex justify-center items-center gap-1.5 mt-2.5">
                            ${dotsHTML}
                        </div>
                    </div>
                `;
            });

            // 2. Process Images
            text = text.replace(/\[(?:img\vert{}image):\s*([^\]]+)\]/gi, function(match, url) {
                return `<img src="${url.trim()}" class="w-full max-h-72 object-cover rounded-xl my-3 shadow-sm max-w-full" onerror="this.src='https://via.placeholder.com/600x300?text=Image'">`;
            });

            // 3. Process Videos
            text = text.replace(/\[video:\s*([^\]]+)\]/gi, function(match, url) {
                url = url.trim();
                let ytId = extractYouTubeId(url);
                if (ytId) {
                    return `<div class="my-3 aspect-video w-full max-w-full"><iframe id="yt_${Math.random().toString(36).substring(2, 9)}" class="yt-embed-player w-full h-full rounded-xl shadow-sm" src="https://www.youtube.com/embed/${ytId}?enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
                }
                return `<video controls class="w-full rounded-xl my-3 shadow-sm max-w-full"><source src="${url}"></video>`;
            });

            // 4. Process Audio
            text = text.replace(/\[audio:\s*([^\]]+)\]/gi, function(match, url) {
                return `<audio controls class="w-full my-3 max-w-full"><source src="${url.trim()}"></audio>`;
            });

            return text;
        }

        function scrollToSlide(carouselId, index) {
            const container = document.getElementById(carouselId);
            if (container) {
                container.scrollTo({ left: index * container.clientWidth, behavior: 'smooth' });
            }
        }

        function updateDots(carouselId, totalSlides) {
            const container = document.getElementById(carouselId);
            const dotsContainer = document.getElementById(carouselId + '_dots');
            if (!container || !dotsContainer) return;
            const scrollPos = container.scrollLeft;
            const slideWidth = container.clientWidth;
            const activeIndex = Math.round(scrollPos / slideWidth);
            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === activeIndex) {
                    dots[i].className = "w-4 h-2 rounded-full transition-all duration-300 bg-indigo-600";
                } else {
                    dots[i].className = "w-2 h-2 rounded-full transition-all duration-300 bg-slate-300";
                }
            }
        }

        function renderArticles(dataToRender) {
            const list = document.getElementById('articles-list');
            const draftsList = document.getElementById('drafts-list');
            const draftsContainer = document.getElementById('drafts-container');

            list.innerHTML = '';
            draftsList.innerHTML = '';

            const publishedArts = dataToRender.filter(a => !a.isDraft);
            const draftArts = articles.filter(a => a.isDraft);

            if (isLoggedIn && draftArts.length > 0) {
                draftsContainer.classList.remove('hidden');
                draftArts.forEach(art => draftsList.appendChild(createCardHTML(art)));
            } else {
                draftsContainer.classList.add('hidden');
            }

            if (publishedArts.length === 0) {
                list.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-10">No published articles yet!</div>';
                return;
            }

            publishedArts.forEach(art => list.appendChild(createCardHTML(art)));

            // Initialize YouTube API players after DOM load
            setTimeout(() => {
                if (window.YT && window.YT.Player) {
                    initYouTubePlayers();
                }
            }, 500);
        }

        function createCardHTML(art) {
            const card = document.createElement('div');
            card.className = 'bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between relative w-full max-w-full overflow-hidden';
            
            const parsedBody = parseContent(art.body);

            let actionButtons = '';
            if (isLoggedIn) {
                actionButtons = `
                    <div class="flex gap-1.5">
                        <button onclick="editArticle(${art.id})" class="text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg text-xs font-bold">✏️</button>
                        <button onclick="deleteArticle(${art.id})" class="text-red-500 bg-red-50 px-2 py-1 rounded-lg text-xs font-bold">🗑</button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="w-full max-w-full overflow-hidden">
                    <div class="flex justify-between items-center mb-2.5 w-full">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded truncate max-w-[65%]" title="${art.category || 'General'}">${art.category || 'General'} ${art.isDraft ? '• DRAFT' : ''}</span>
                        ${actionButtons}
                    </div>
                    <h3 class="text-lg font-bold mb-2 text-slate-800 strict-break">${art.title}</h3>
                    <div class="text-slate-600 text-sm whitespace-pre-line leading-relaxed strict-break overflow-hidden">${parsedBody}</div>
                </div>
            `;
            return card;
        }

        function handleAuthorAccess() {
            if (isLoggedIn) {
                toggleAdmin();
            } else {
                const pass = prompt("Enter Author Password:");
                if (pass === ADMIN_PASSWORD) {
                    isLoggedIn = true;
                    document.getElementById('author-btn').innerText = 'Dashboard 🔓';
                    toggleAdmin();
                    renderArticles(articles);
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        function saveArticle(isDraft) {
            const title = document.getElementById('art-title').value.trim();
            const category = document.getElementById('art-cat').value.trim();
            const body = document.getElementById('art-body').value.trim();
            const editingId = document.getElementById('editing-id').value;

            if (!title || !body) {
                alert('Please fill in Title and Content!');
                return;
            }

            if (editingId) {
                const index = articles.findIndex(a => a.id == editingId);
                if (index !== -1) {
                    articles[index] = { ...articles[index], title, category, body, isDraft };
                }
            } else {
                const newArt = { id: Date.now(), title, category, body, isDraft };
                articles.unshift(newArt);
            }

            saveAndRender();
            resetForm();
            toggleAdmin();
            alert(isDraft ? 'Draft Saved 💾' : 'Published Successfully 🚀');
        }

        function editArticle(id) {
            const art = articles.find(a => a.id === id);
            if (!art) return;

            document.getElementById('editing-id').value = art.id;
            document.getElementById('art-title').value = art.title;
            document.getElementById('art-cat').value = art.category;
            document.getElementById('art-body').value = art.body;
            document.getElementById('form-title').innerText = 'Edit Article ✏️';

            const panel = document.getElementById('admin-panel');
            panel.classList.remove('hidden');
            window.scrollTo({ top: panel.offsetTop - 50, behavior: 'smooth' });
        }

        function deleteArticle(id) {
            if (confirm("Delete this article?")) {
                articles = articles.filter(art => art.id !== id);
                saveAndRender();
            }
        }

        function resetForm() {
            document.getElementById('editing-id').value = '';
            document.getElementById('art-title').value = '';
            document.getElementById('art-cat').value = '';
            document.getElementById('art-body').value = '';
            document.getElementById('form-title').innerText = 'Publish New Article 📝';
        }

        function filterArticles() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = articles.filter(art => 
                art.title.toLowerCase().includes(query) || 
                art.category.toLowerCase().includes(query) || 
                art.body.toLowerCase().includes(query)
            );
            renderArticles(filtered);
        }

        function onYouTubeIframeAPIReady() {
            initYouTubePlayers();
        }

        // Initial Load
        renderArticles(articles);
    </script>
</body>
</html>
